<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>パスキー認証</title>
</head>
<body>
  <h2>パスキー認証</h2>

  <p>
    下のボタンを押してください。
  </p>

  <p>
    <a id="fidoLink"
       href="#"
       style="
         display:inline-block;
         padding:16px 24px;
         background:#1976d2;
         color:white;
         text-decoration:none;
         border-radius:8px;
         font-size:18px;
       ">
      認証を開始
    </a>
  </p>

  <p id="status"></p>

  <script>
    const status = document.getElementById("status");
    const link = document.getElementById("fidoLink");

    let fido = location.hash.substring(1);

    try {
      fido = decodeURIComponent(fido);
    } catch (e) {
      // そのまま使用
    }

    if (!fido.toLowerCase().startsWith("fido:/")) {
      status.textContent = "FIDO認証情報がありません。";
      link.style.display = "none";
    } else {
      /*
       * JavaScriptの location.href ではなく、
       * 実際の <a href="fido:/..."> を生成する。
       *
       * Android Chromeから見れば、
       * ユーザーが明示的にカスタムURIリンクを
       * タップした形になる。
       */
      link.href = fido;
      status.textContent = "認証情報を受信しました。";
    }
  </script>
</body>
</html>
