<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>パスキー認証</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 20px;
    }

    #qrcode {
      margin: 20px auto;
      width: 320px;
      min-height: 320px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h2>パスキー認証</h2>

  <p><strong>Redirect Page v1.0.7</strong></p>

  <p>FIDO認証用QRコード</p>

  <div id="qrcode"></div>

  <p id="status">認証情報を確認しています...</p>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <script>
    const VERSION = "v1.0.7";

    const status = document.getElementById("status");
    const qrArea = document.getElementById("qrcode");

    let fido = location.hash.substring(1);

    try {
      fido = decodeURIComponent(fido);
    } catch (e) {
      // デコードできない場合はそのまま使用
    }

    if (!/^fido:\//i.test(fido)) {

      status.textContent =
        "FIDO認証情報がありません。";

    } else {

      new QRCode(qrArea, {
        text: fido,
        width: 320,
        height: 320,
        correctLevel: QRCode.CorrectLevel.M
      });

      status.textContent =
        "FIDO QRコードを生成しました。";
    }
  </script>

</body>
</html>
