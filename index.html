<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kabuステーション パスキー認証</title>
<style>
body{font-family:sans-serif;max-width:560px;margin:48px auto;padding:0 20px;line-height:1.6}
button{font-size:18px;padding:14px 20px;width:100%}.note{color:#555;font-size:14px}.error{color:#b00020}
</style>
</head>
<body>
<h1>パスキー認証</h1>
<p id="status">認証情報を確認しています…</p>
<button id="open" type="button" hidden>パスキー認証を開始</button>
<p class="note">認証情報はURLの # 以降だけで処理し、このページからサーバーへ送信しません。</p>
<script>
(() => {
  const status = document.getElementById('status');
  const button = document.getElementById('open');
  let target = '';
  try {
    target = decodeURIComponent(location.hash.slice(1));
  } catch (_) {}
  if (!/^fido:\/\/[0-9]+$/i.test(target) && !/^fido:\/[0-9]+$/i.test(target)) {
    status.textContent = '有効なFIDO認証情報がありません。';
    status.className = 'error';
    return;
  }
  status.textContent = 'パスキー認証を開始します。開始しない場合は下のボタンを押してください。';
  button.hidden = false;
  const openFido = () => { window.location.href = target; };
  button.addEventListener('click', openFido);
  setTimeout(openFido, 150);
})();
</script>
</body>
</html>
