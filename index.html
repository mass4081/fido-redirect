<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>パスキー認証</title>
</head>

<body>
  <h2>パスキー認証</h2>

  <p><strong>Redirect Page v1.0.4</strong></p>

  <p>下のボタンを押してください。</p>

  <p>
    <button
      id="startButton"
      type="button"
      style="
        padding: 16px 24px;
        background: #1976d2;
        color: white;
        border: 0;
        border-radius: 8px;
        font-size: 18px;
      "
    >
      認証を開始
    </button>
  </p>

  <p id="status">認証情報を確認しています...</p>

  <pre
    id="result"
    style="
      white-space: pre-wrap;
      word-break: break-all;
      background: #eeeeee;
      padding: 12px;
    "
  ></pre>

  <script>
    const VERSION = "v1.0.4";

    const button = document.getElementById("startButton");
    const status = document.getElementById("status");
    const result = document.getElementById("result");

    let fido = location.hash.substring(1);

    try {
      fido = decodeURIComponent(fido);
    } catch (e) {
      // デコードできない場合はそのまま使用
    }

    if (!/^fido:\//i.test(fido)) {
      status.textContent = "FIDO認証情報がありません。";
      button.disabled = true;
    } else {
      status.textContent = "認証情報を受信しました。";
    }

    button.addEventListener("click", function () {

      if (!/^fido:\//i.test(fido)) {
        result.textContent =
          "VERSION: " + VERSION + "\n" +
          "FIDO: NG";
        return;
      }

      const payload = fido.replace(/^fido:\//i, "");

      const intentUrl =
        "intent:/" +
        payload +
        "#Intent;scheme=fido;end";

      /*
       * クリックイベントの中で直接実行する。
       * Android Chromeにユーザー操作として認識させるため。
       */
      result.textContent =
        "VERSION: " + VERSION + "\n" +
        "CLICK: OK\n" +
        "FIDO: OK\n" +
        "INTENT: CREATED\n" +
        "INTENTを起動します...";

      window.location.href = intentUrl;
    });
  </script>
</body>
</html>
