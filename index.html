<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>パスキー認証</title>
</head>

<body>
  <h2>パスキー認証</h2>

  <p><strong>Redirect Page v1.0.3</strong></p>

  <p>診断用ページです。</p>

  <p>
    <button
      id="startButton"
      type="button"
      style="
        padding: 16px 24px;
        background: #1976d2;
        color: white;
        border: 0;
        border-radius: 8px;
        font-size: 18px;
      "
    >
      診断開始
    </button>
  </p>

  <hr>

  <p><strong>診断結果</strong></p>

  <pre
    id="result"
    style="
      white-space: pre-wrap;
      word-break: break-all;
      background: #eeeeee;
      padding: 12px;
    "
  >待機中...</pre>

  <script>
    const VERSION = "v1.0.3";

    const button = document.getElementById("startButton");
    const result = document.getElementById("result");

    function mask(value) {
      if (!value) {
        return "(なし)";
      }

      if (value.length <= 20) {
        return value;
      }

      return (
        value.substring(0, 12) +
        "..." +
        value.substring(value.length - 8)
      );
    }

    button.addEventListener("click", function () {
      let output = "";

      output += "VERSION: " + VERSION + "\n";
      output += "CLICK: OK\n";
      output += "USER_AGENT: " + navigator.userAgent + "\n\n";

      const rawHash = location.hash;

      output += "HASH EXISTS: ";
      output += rawHash.length > 1 ? "YES" : "NO";
      output += "\n";

      let fido = rawHash.substring(1);

      try {
        fido = decodeURIComponent(fido);
        output += "DECODE: OK\n";
      } catch (e) {
        output += "DECODE: FAILED\n";
      }

      output += "FIDO PREFIX: ";
      output += /^fido:\//i.test(fido) ? "OK" : "NG";
      output += "\n";

      output += "FIDO LENGTH: " + fido.length + "\n";
      output += "FIDO MASKED: " + mask(fido) + "\n\n";

      if (!/^fido:\//i.test(fido)) {
        output += "RESULT: FIDO URIが取得できていません。\n";
        result.textContent = output;
        return;
      }

      const payload = fido.replace(/^fido:\//i, "");

      const intentUrl =
        "intent:/" +
        payload +
        "#Intent;scheme=fido;end";

      output += "INTENT CREATED: YES\n";
      output += "INTENT LENGTH: " + intentUrl.length + "\n";
      output += "INTENT MASKED: " + mask(intentUrl) + "\n\n";

      output += "RESULT: 診断完了\n";
      output += "※このv1.0.3では意図的にFIDOを起動しません。";

      result.textContent = output;
    });
  </script>
</body>
</html>
