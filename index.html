<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>パスキー認証</title>
</head>

<body>
  <h2>パスキー認証</h2>

  <p><strong>Redirect Page v1.0.2</strong></p>

  <p>下のボタンを押してください。</p>

  <p>
    <a
      id="startButton"
      href="#"
      style="
        display: inline-block;
        padding: 16px 24px;
        background: #1976d2;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-size: 18px;
      "
    >
      認証を開始
    </a>
  </p>

  <p id="status">認証情報を確認しています...</p>

  <script>
    const button = document.getElementById("startButton");
    const status = document.getElementById("status");

    let fido = location.hash.substring(1);

    try {
      fido = decodeURIComponent(fido);
    } catch (e) {
      // デコードできない場合は、そのまま使用する
    }

    if (!/^fido:\//i.test(fido)) {
      status.textContent = "FIDO認証情報がありません。";
      button.style.display = "none";
    } else {
      /*
       * 受信例:
       * FIDO:/123456789...
       *
       * Android Chrome用:
       * intent:/123456789...#Intent;scheme=fido;end
       */

      const payload = fido.replace(/^fido:\//i, "");

      const intentUrl =
        "intent:/" +
        payload +
        "#Intent;scheme=fido;end";

      button.href = intentUrl;

      status.textContent = "認証情報を受信しました。";
    }
  </script>
</body>
</html>
