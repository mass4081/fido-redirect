<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>パスキー認証</title>
</head>

<body>
  <h2>パスキー認証</h2>
  <p><strong>Redirect Page v1.0.5</strong></p>

  <p id="status">認証情報を確認しています...</p>

  <p>
    <a id="test1"
       style="display:block;padding:16px;margin:12px 0;background:#ddd;">
      TEST 1：FIDO直接
    </a>
  </p>

  <p>
    <a id="test2"
       style="display:block;padding:16px;margin:12px 0;background:#ddd;">
      TEST 2：Intent /
    </a>
  </p>

  <p>
    <a id="test3"
       style="display:block;padding:16px;margin:12px 0;background:#ddd;">
      TEST 3：Intent //
    </a>
  </p>

  <pre id="result"></pre>

  <script>
    const VERSION = "v1.0.5";

    const status = document.getElementById("status");
    const result = document.getElementById("result");

    let fido = location.hash.substring(1);

    try {
      fido = decodeURIComponent(fido);
    } catch (e) {
    }

    if (!/^fido:\//i.test(fido)) {
      status.textContent = "FIDO認証情報がありません。";
    } else {

      const payload = fido.replace(/^fido:\//i, "");

      const directUrl =
        fido;

      const intent1 =
        "intent:/" +
        payload +
        "#Intent;scheme=fido;end";

      const intent2 =
        "intent://" +
        payload +
        "#Intent;scheme=fido;end";

      document.getElementById("test1").href = directUrl;
      document.getElementById("test2").href = intent1;
      document.getElementById("test3").href = intent2;

      status.textContent =
        "FIDO認証情報を受信しました。";

      result.textContent =
        "VERSION: " + VERSION + "\n" +
        "FIDO: OK\n" +
        "3方式をテストできます。";
    }
  </script>
</body>
</html>
